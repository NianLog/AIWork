# AI 中台网关（P0-5 批次 E）server 级装配片段
# 装载方式：放入 /www/server/panel/vhost/nginx/extension/jbslab.bili/gateway.conf
# （站点 conf 的 extension include 槽自动加载本目录所有 conf）。
# 分工：站点 conf 归宝塔面板管理（反向代理/SSL/伪静态由面板功能自动维护），
# 网关逻辑独立于此文件；gateway.lua 更新只走 FTP 到
# /www/wwwroot/aiwork/aiwork-portal/gateway/lua/，无需再改面板任何配置。

# 共享密钥：与后端 compose 的 PORTAL_GATEWAY_SECRET 完全一致；只存在于服务器，
# 不进 git 仓库（仓库版此处为占位值）。为空或占位时 lua 拒绝转发（fail-closed）。
set $gateway_secret "CHANGE_ME_SAME_AS_BACKEND";
# 动态上游占位（gateway.lua 按注册表写入完整 URL）
set $proxied "";

# ---- 安全响应头（批次 G）：全站生效，server 级随 extension 槽位装载 ----
# 依据与边界：
# - X-Frame-Options 用 SAMEORIGIN 不是 DENY：门户工作区以同源 iframe 承载子应用
#   （/subapps/**），SAMEORIGIN 恰好放行同源嵌入、拒绝外部站点嵌入门户（防点击
#   劫持）；门户自嵌防御归前端 embeddedGuard，两层各管各的威胁。
# - CSP 只在生产层下发（vite dev 的 HMR 需要 ws/内联脚本）；两端 index.html 无
#   inline script，script-src 'self' 对构建产物安全。style-src 带 'unsafe-inline'
#   是 React/组件库内联 style 属性的既成事实，全站 0 dangerouslySetInnerHTML。
# - 未来接跨源子应用时需在 frame-src 追加其域名。
# - 继承规则已核对：本文件 location ^~ /api/ 与站点静态资源 location 均无自身
#   add_header，完整继承本段；与站点 SSL 块的 HSTS 同级叠加，无冲突。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# ^~ 前缀优先于站点 conf 内一切正则 location（敏感文件/缓存规则等），
# /api 请求不可能被截走；appId 与剩余路径由 lua 从 URI 解析（本文件不含
# 自写正则 location）。语义：/api/{appId}/** → 令牌校验（5 秒缓存）→ 注册表
# 路由（30 秒缓存）→ 前缀代理到 backendApi + 去前缀路径。
location ^~ /api/ {
    access_by_lua_file /www/wwwroot/aiwork/aiwork-portal/gateway/lua/gateway.lua;

    # §8.3：AI 长任务超时、SSE 流式不缓冲、素材大上传
    proxy_read_timeout 120s;
    proxy_buffering off;
    client_max_body_size 100m;

    # §8.2/§8.3：上游响应不得携带身份头回传
    proxy_hide_header X-User-Id;
    proxy_hide_header X-Tenant-Id;
    proxy_hide_header X-Org-Id;
    proxy_hide_header X-User-Roles;
    proxy_hide_header X-User-Permissions;
    proxy_hide_header X-App-Id;
    proxy_hide_header X-Request-Id;
    proxy_hide_header X-Gateway-Signature;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass $proxied;
}

# ---- 子应用静态产物（批次 I，§7 发布链路）----
# 后端上传链路把版本目录写入 /www/wwwroot/aiwork/aiwork-portal/mfe-storage/
# subapps/{appId}/{version}/（compose 卷与容器 /app/mfe-storage 同一份数据），
# nginx 按 root 一行映射 URI↔磁盘，新目录出现即生效（零重启，C1）。
#
# 为什么是单个 ^~ 而不是「assets regex + 普通前缀」两个 location：本文件经
# extension include 装进站点 conf 的 server 块，regex location 的优先级取决于
# 声明顺序——站点自带的 .js/.css 缓存 regex 可能先命中，immutable 规则会被
# 抢走。^~ 前缀压制一切 regex（与上面 /api/ 同一策略），assets 的不可变缓存
# 改在 location 内用 if+set 区分（set 是 if 的安全用法，无 rewrite 副作用）。
# try_files 带 $uri/：entry 是版本目录（/subapps/{appId}/{version}/），
# 目录请求须经 index 内部重定向到 index.html。
#
# add_header 继承断裂：location 内一旦有 add_header，上面的批次 G 安全头对本
# location 失效——四条安全头在此原样重发（与 server 级逐字一致）。
location ^~ /subapps/ {
    root /www/wwwroot/aiwork/aiwork-portal/mfe-storage;

    set $subapps_cache "no-cache";
    if ($uri ~ ^/subapps/[^/]+/[^/]+/assets/) {
        # 版本目录不可变：assets 带内容指纹，一年 immutable
        set $subapps_cache "public, max-age=31536000, immutable";
    }
    add_header Cache-Control $subapps_cache always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    index index.html;
    try_files $uri $uri/ =404;
}

# ---- 内部上游：仅供 lua ngx.location.capture，浏览器不可达 ----
location = /_gw/auth {
    internal;
    proxy_pass http://127.0.0.1:48080/admin-api/system/auth/get-permission-info;
}
location = /_gw/route {
    internal;
    proxy_pass http://127.0.0.1:48080/admin-api/portal-app/route;
}
