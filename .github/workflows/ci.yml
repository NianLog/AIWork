name: 工程校验

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 校验 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 记录锁文件状态
        id: lockfile
        env:
          HAS_LOCKFILE: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: printf 'present=%s\n' "$HAS_LOCKFILE" >> "$GITHUB_OUTPUT"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置固定版本 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 按锁文件安装
        if: steps.lockfile.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: 首次安装并生成待提交锁文件
        if: steps.lockfile.outputs.present != 'true'
        run: |
          echo "::warning::尚未提交 pnpm-lock.yaml，本轮依赖不可严格复现；请验证并提交导出的锁文件。"
          pnpm install --no-frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: ESLint 检查
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 决策笔记校验
        env:
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm notes:verify
          pnpm notes index --check

      - name: 构建双前端
        run: pnpm build

      - name: 导出首次生成的锁文件
        if: ${{ always() && steps.lockfile.outputs.present != 'true' && hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-${{ matrix.os }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

  audit:
    name: 依赖安全审计
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置固定版本 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # 批次 L2：锁文件级审计门禁，只拦 critical（生产运行时暴露面）。
      # high 及以下归批次 O 随依赖大版本升级（react-router 7 / vite 6 /
      # vitest 4）一并处理——现在强拦会卡在"无修复版本"的传递依赖上，
      # 门禁永远红等于没有门禁。--prod 限定生产依赖：dev 依赖不进运行时，
      # 构建链风险由锁文件冻结 + 本审计记录兜底。
      - name: pnpm audit（critical 门禁）
        run: pnpm audit --prod --audit-level=critical
